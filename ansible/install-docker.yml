---
- name: Update the VM and install Docker with Nginx routing
  hosts: docker_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Update APT package metadata and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        upgrade: dist

    - name: Install Docker Engine from the distribution repository
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Install Nginx for frontend, API, and screenshot routing
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Create the host directories shared by Docker and Nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /srv/house-bot/frontend
        - /srv/house-bot/screenshots

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Allow the SSH user to run Docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
