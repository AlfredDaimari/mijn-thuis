[pytest]
testpaths = tests
addopts = -ra --tb=short
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    unit: Fast, isolated tests for parsing and configuration.
    database: SQLite queue and concurrency tests.
    service: Poller and processor workflow tests.
    resolver: Local Playwright resolver workflow tests using fakes.
    integration: Opt-in tests that use external Yahoo or Stekkies data.
